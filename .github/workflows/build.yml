name: Build iRemove IPA (TrollStore)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos environment
        uses: actions/cache@v3
        with:
          path: ~/theos
          key: ${{ runner.os }}-theos

      - name: Install dependencies & Theos
        run: |
          brew install ldid
          if [ ! -d "$HOME/theos" ]; then
            git clone --recursive https://github.com/theos/theos.git ~/theos
          fi

      - name: Build iRemove Application
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/iRemove.app
          
          # 1. Compile standalone Root Helper (iremovehelper)
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=14.0 -fobjc-arc helper_main.m -o Payload/iRemove.app/iremovehelper -framework Foundation
          chmod 0755 Payload/iRemove.app/iremovehelper
          ldid -Sentitlements.plist Payload/iRemove.app/iremovehelper

          # 2. Compile Obj-C RootHelper wrapper for GUI
          xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SDK_PATH" -miphoneos-version-min=14.0 -fobjc-arc -c RootHelper.m -o RootHelper.o
          
          # 3. Compile Swift sources & link main app
          xcrun -sdk iphoneos swiftc -O -target arm64-apple-ios14.0 -sdk "$SDK_PATH" -import-objc-header iRemove-Bridging-Header.h -emit-executable iRemoveApp.swift ContentView.swift RootHelper.o -o Payload/iRemove.app/iRemove -framework UIKit -framework SwiftUI
          
          # 4. Copy Info.plist & sign main app
          cp Info.plist Payload/iRemove.app/Info.plist
          ldid -Sentitlements.plist Payload/iRemove.app/iRemove
          
          # 5. Package into IPA
          zip -r9 iRemove.ipa Payload
          ls -la iRemove.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iRemove-TrollStore-IPA
          path: iRemove.ipa

      - name: Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: iRemove.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
